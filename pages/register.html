<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>UPSC Cloud | Register</title>

    <link rel="stylesheet" href="../css/auth.css">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="register-container">

        <div class="register-box">

            <div class="logo">

                <i class="fas fa-landmark"></i>

                <h1>UPSC Hub</h1>

                <p>Create Your Aspirant Account</p>

            </div>

            <form id="registerForm">

                <!-- Personal Information -->

                <h2>Personal Information</h2>

                <div class="input-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="fullname"
                        placeholder="Enter your full name">

                </div>

                <div class="input-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email">

                </div>

                <div class="input-group">

                    <label>Mobile Number</label>

                    <input
                        type="tel"
                        id="mobile"
                        maxlength="10"
                        placeholder="Enter mobile number">

                </div>

                <div class="input-group">

                    <label>Date of Birth</label>

                    <input
                        type="date"
                        id="dob">

                </div>

                <div class="input-group">

                    <label>Gender</label>

                    <select id="gender">

                        <option value="">Select Gender</option>

                        <option>Male</option>

                        <option>Female</option>

                        <option>Other</option>

                    </select>

                </div>

                <!-- UPSC Details -->

                <h2>UPSC Information</h2>

                <div class="input-group">

                    <label>Preferred Language</label>

                    <select id="language">

                        <option value="">Select Language</option>

                        <option>English</option>

                        <option>Hindi</option>

                        <option>Kannada</option>

                        <option>Tamil</option>

                        <option>Telugu</option>

                        <option>Malayalam</option>

                        <option>Marathi</option>

                    </select>

                </div>

                <div class="input-group">

                    <label>State</label>

                    <select id="state">

                        <option value="">Select State</option>

                        <option>Andhra Pradesh</option>

                        <option>Arunachal Pradesh</option>

                        <option>Assam</option>

                        <option>Bihar</option>

                        <option>Chhattisgarh</option>

                        <option>Goa</option>

                        <option>Gujarat</option>

                        <option>Haryana</option>

                        <option>Himachal Pradesh</option>

                        <option>Jharkhand</option>

                        <option>Karnataka</option>

                        <option>Kerala</option>

                        <option>Madhya Pradesh</option>

                        <option>Maharashtra</option>

                        <option>Odisha</option>

                        <option>Punjab</option>

                        <option>Rajasthan</option>

                        <option>Tamil Nadu</option>

                        <option>Telangana</option>

                        <option>Uttar Pradesh</option>

                        <option>West Bengal</option>

                    </select>

                </div>

                <div class="input-group">

                    <label>Educational Qualification</label>

                    <select id="qualification">

                        <option value="">Select Qualification</option>

                        <option>Graduate</option>

                        <option>Post Graduate</option>

                        <option>Engineering</option>

                        <option>Medical</option>

                        <option>Law</option>

                        <option>Other</option>

                    </select>

                </div>

                <div class="input-group">

                    <label>UPSC Attempt</label>

                    <select id="attempt">

                        <option value="">Select Attempt</option>

                        <option>First Attempt</option>

                        <option>Second Attempt</option>

                        <option>Third Attempt</option>

                        <option>Fourth Attempt</option>

                        <option>More than Four</option>

                    </select>

                </div>

                <!-- Security -->

                <h2>Security</h2>

                <div class="input-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create password">

                        <i class="fas fa-eye"
                            id="toggleRegisterPassword"></i>

                    </div>

                </div>

                <div class="input-group">

                    <label>Confirm Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password">

                        <i class="fas fa-eye"
                            id="toggleConfirmPassword"></i>

                    </div>

                </div>

                <!-- Password Strength -->

                <div class="strength">

                    <div class="strength-bar">

                        <div id="strengthFill"></div>

                    </div>

                    <small id="strengthText">
                        Password Strength
                    </small>

                </div>

                <!-- Terms -->

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms">

                        I agree to the Terms & Conditions

                    </label>

                </div>

                <!-- Button -->

                <button type="submit">

                    Create Account

                </button>

            </form>

            <div class="bottom-links">

                <p>

                    Already have an account?

                    <a href="login.html">

                        Login Here

                    </a>

                </p>

                <a href="../index.html">

                    ← Back to Home

                </a>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabaseClient.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
